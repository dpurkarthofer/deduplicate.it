; PHP settings required by deduplicate.it.
;
; On shared hosting running PHP-FPM, place this file beside index.php; changes
; take effect once the FPM cache expires (typically a few minutes). On other
; setups these directives belong in php.ini or a vhost configuration instead.
;
; The defaults matter: PHP ships with upload_max_filesize = 2M, which is smaller
; than a typical database export, so uploads fail silently without these values.

upload_max_filesize = 64M
post_max_size       = 128M
max_file_uploads    = 50
memory_limit        = 256M
max_execution_time  = 120
